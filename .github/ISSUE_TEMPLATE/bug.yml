name: Signaler un bogue · Bug report
description: Un schéma mal lu, un champ personnel raté ou relevé à tort, un rapport erroné. A schema read wrong, a personal field missed or flagged wrongly, a report that's wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui s’est passé, et ce que vous attendiez · What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Le plus petit schéma ou la plus petite configuration qui le montre · The smallest schema or config that shows it
      description: Quelques lignes de schema.prisma, d’une migration ou de law25.config.mjs. Retirez tout ce qui est privé. A few lines of schema.prisma, a migration or law25.config.mjs; leave out anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version de maisongr-law25 · maisongr-law25 version
      description: "`npx maisongr-law25 --version`"
    validations:
      required: true
