name: Feature request
description: A schema source, a check or a part of the report you need.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need, and why
      description: The project it's for (stack, ORM) helps more than a proposed API. For anything about the law, the section it comes from.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
